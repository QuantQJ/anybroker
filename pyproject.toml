[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "anybroker"
version = "0.1.0"
description = "One interface over the brokers you actually trade: ccxt for crypto, native venues for the futures and retail brokers ccxt has never had."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "QuantQJ" }]
keywords = ["trading", "broker", "futures", "ibkr", "tradovate", "ccxt", "orders"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
crypto = ["ccxt>=4.4.0"]
ibkr = ["ib_insync>=0.9.86"]
tradovate = ["tradovate-client @ git+https://github.com/QuantQJ/tradovate-client.git"]
alpaca = ["alpaca-py>=0.33"]
all = ["ccxt>=4.4.0", "ib_insync>=0.9.86", "alpaca-py>=0.33"]
dev = [
  "pytest>=7.4",
  "mypy>=1.8",
  "ruff>=0.6",
  # every venue SDK, so CI runs the tests that assert real payloads
  "ccxt>=4.4.0",
  "ib_insync>=0.9.86",
  "alpaca-py>=0.33",
]

[project.urls]
Homepage = "https://github.com/QuantQJ/anybroker"
Source = "https://github.com/QuantQJ/anybroker"
Issues = "https://github.com/QuantQJ/anybroker/issues"

[tool.hatch.metadata]
# The venue extras install from git: these libraries are distributed
# through GitHub and not published to PyPI, so a version specifier
# would never resolve. Hatchling requires this to be explicit.
allow-direct-references = true

[project.scripts]
# The webhook bridge, as its own command: the alert server needs no venue
# extra of its own, because the venue it routes to is this same package.
anyhook = "anybroker.webhook.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anybroker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# Keep the quote style the code already uses; reformatting every string buys
# nothing and makes the history unreadable.
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
  "E501",    # line length is ruff-format's business
  "UP031",   # percent formatting is the house style and is correct for logging
  "ARG002",  # unused arguments are part of an interface a subclass fills in
  "ARG003",
  "B008",
  "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# B018/ARG005: a test that accesses a property inside pytest.raises IS the
# assertion -- the "useless expression" is the thing under test.
# PTH101: chmod on a temp file in a fixture needs no pathlib ceremony.
"tests/*" = ["B018", "ARG005", "PTH101", "ARG001", "SIM117", "B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["src"]
